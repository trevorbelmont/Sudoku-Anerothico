name: CD - Deploy Google Apps Script

on:
  workflow_run:
    workflows: ["Sudoku CI - Testes Automatizados"]  # Deve bater com o 'name:' do ci-auto-tests.yml
    types:
      - completed
    branches:
      - main
  workflow_dispatch:  # Permite disparo manual pela aba Actions do GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Via push: só roda se o CI passou. Via disparo manual: sempre roda.
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar Clasp
        run: npm install -g @google/clasp

      - name: Configurar Credenciais do Clasp
        run: |
          cat << 'EOF' > ~/.clasprc.json
          ${{ secrets.CLASP_CREDENTIALS }}
          EOF

      - name: Recriar .clasp.json a partir do secret
        run: |
          echo '{"scriptId":"${{ secrets.GAS_SCRIPT_ID }}","rootDir":"."}' > backend/GAS/.clasp.json

      - name: Deploy para o Google Apps Script
        run: |
            cd backend/GAS
            # Mostra se o clasp.json está na pasta correta antes do push
            ls -la
            # Puxa o status do projeto e depois faz o push forçado
            clasp status
            clasp push -f
